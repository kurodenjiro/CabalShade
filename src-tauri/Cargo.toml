# This manifest is both the workspace root and the Tauri app package. Tauri
# expects its package at src-tauri/, so the workspace lives here rather than at
# the repo root.
#
# Extracted crates go in crates/ and must not depend on this package — the
# dependency arrow points inward, toward the domain.
[workspace]
members = ["crates/*"]
# `crates/src/` is not a crate — it is the accidental landing spot for
# cabal-core's ts-rs output when the bindings test runs without
# TS_RS_EXPORT_DIR set. Excluding it keeps `cargo test --workspace` from
# trying to parse a directory that is never a package.
exclude = ["crates/src"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[package]
name = "cabalmesh"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cabalmesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# On by default so an ordinary `cargo build` still produces a working desktop
# app. Mobile builds get it too, but the module is additionally gated on
# `cfg(desktop)`, so nothing legacy is compiled or registered for a phone.
#
# Turn it off to see the app with only the reshaped command surface — which is
# the state mobile already ships in.
default = ["desktop-legacy"]

# The frozen desktop IPC surface: 50 commands with signatures held byte-identical
# for the unmaintained desktop UI. See src/legacy/mod.rs.
desktop-legacy = []
ts-rs = ["dep:ts-rs", "cabal-core/ts-rs"]

[dependencies]
# The domain model. No I/O, no runtime — see crates/cabal-core/src/lib.rs.
cabal-core = { path = "crates/cabal-core" }
cabal-store = { path = "crates/cabal-store" }
cabal-vault = { path = "crates/cabal-vault" }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }

# Mesh Networking (libp2p)
# QUIC alongside TCP: a phone changes networks constantly, and QUIC connection
# migration survives a Wi-Fi to cellular handoff where a TCP socket does not.
# identify/ping/relay/dcutr are what make off-LAN discovery possible at all —
# mDNS alone is a room-sized mesh.
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "quic",
    "dns",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "identify",
    "ping",
    "relay",
    "dcutr",
    "macros",
] }
libp2p-swarm = { version = "0.45", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# HTTP client.
#
# rustls, not native-tls: Android ships no system OpenSSL, so a native-tls
# build either fails to link or fails at runtime on device.
#
# Version tracks alloy's transport (0.13) so exactly one reqwest major exists
# in the tree. The repo previously carried 0.11 here against alloy's 0.13,
# compiling two full HTTP stacks.
# NB: 0.13 renamed the rustls feature from `rustls-tls` to `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }

# The resolver behind libp2p's DNS transport, pinned to the version libp2p-dns
# 0.42 uses so the config types are the same ones its builder accepts.
#
# Direct because the swarm reads the system resolver itself: libp2p's
# `with_dns()` treats a missing `/etc/resolv.conf` as fatal, which is every
# Android device. See `resolver_settings` in src/mesh.rs.
hickory-resolver = { version = "0.24", default-features = false, features = ["system-config"] }

# Structured, span-aware diagnostics. Libraries emit through the facade only;
# the app crate is the single place a subscriber is installed.
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# Additional utilities
futures = "0.3"
async-trait = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Avalanche C-Chain backend: EVM provider, local signing, addresses.
# Trimmed features keep the cross-compile surface and binary size down.
alloy = { version = "1", default-features = false, features = [
    "provider-http",
    "signer-local",
    "rpc-types-eth",
] }

# BIP-39 mnemonics: the export/import format for the wallet. A keypair is
# derived from (or serialized to) a checksummed 12-word phrase.
bip39 = { version = "2", default-features = false, features = ["std", "rand"] }

rand = "0.9.2"
aes-gcm = "0.10.3"
base64 = "0.22.1"
lopdf = "0.44"

# Wipes key material from memory on drop, so a heap dump after the fact does
# not still contain it.
zeroize = "1"
thiserror.workspace = true
tokio-util = { version = "0.7.19", features = ["rt"] }
ts-rs = { version = "12.0.1", optional = true }

# Desktop-only. A mobile bundle has no .env file to read and no environment to
# read it into, so this must never enter the mobile dependency graph.
#
# Cargo has no "target-conditional workspace member" or cfg(desktop)-gated
# dependency — Tauri's cfg values are set by tauri-build, far too late to
# influence resolution. Target-specific dependencies are the mechanism that
# actually works.
#
# The full replacement (a compiled-in per-network address table) is ticket 24;
# this keeps the local desktop dev workflow intact until then.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
dotenv = "0.15.0"

# Apple platforms route to the unified log, so iOS output shows in Console.app
# and macOS `log stream` — the only way to see anything from a device.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
tracing-oslog = "0.3"

# Android routes to logcat, the equivalent there.
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

# Android is the only platform where rustls has to be handed a trust store.
#
# Every rustls feature of reqwest 0.13 pulls in rustls-platform-verifier, and on
# Android that crate reads the system trust store through the JVM. It panics on
# first use until initialized, so these exist to perform that handshake — see
# src/tls.rs. `jni` is pinned to 0.22 to match the verifier's; tauri is on 0.21
# and the two are not interchangeable.
rustls-platform-verifier = "0.7"
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
cabal-store = { path = "crates/cabal-store" }
tempfile = "3"
cabal-core = { path = "crates/cabal-core" }
insta = "1.48.0"
tauri = { version = "2", features = ["test"] }

